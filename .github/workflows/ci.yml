name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rocky10
            os: rocky
          - distro: ubuntu2404
            os: ubuntu
          - distro: debian13
            os: debian
    name: e2e (${{ matrix.distro }})
    # The host container is privileged, so circuit-valkey can set
    # vm.overcommit_memory.
    env:
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_os: ${{ matrix.os }}
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Finish Fleet's setup through its API
        working-directory: examples/local
        run: ./setup.sh
      - name: Enroll the host with osquery, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_os: ${{ matrix.os }}
          TF_VAR_enroll: "true"
        run: |
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Setup is closed, a wrong enroll secret is refused, the host is listed
      # and online, and it answers a live query.
      - name: Check Fleet lists the host and it answers a live query
        working-directory: examples/local
        run: ./check.sh
      - name: Check no secret reached the state
        working-directory: examples/local
        run: "! grep -E 'correct-horse|staple-paper|example-only|example-enroll' terraform.tfstate"
      - name: Show the logs
        if: failure()
        run: sudo podman exec circuit-fleet journalctl --no-pager -n 80 -u fleet -u osqueryd || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
